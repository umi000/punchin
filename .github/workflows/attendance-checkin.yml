name: Attendance Check-In

on:
  schedule:
    # 08:45 AM PKT (UTC+5) = 03:45 AM UTC
    # Format: minute hour day month weekday (1-5 is Mon-Fri)
    - cron: '05 2 * * 1-5'
  workflow_dispatch:  # Allows you to click "Run workflow" manually

jobs:
  check-in:
    runs-on: ubuntu-latest
    name: Automated Check-In
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check-in
        env:
          ATTENDANCE_EMAIL: ${{ secrets.ATTENDANCE_EMAIL }}
          ATTENDANCE_PASSWORD: ${{ secrets.ATTENDANCE_PASSWORD }}
        run: npm run check-in

